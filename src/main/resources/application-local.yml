spring:
  # ── Database (PostgreSQL running in Docker) ─────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/bookit
    username: bookit_user
    password: ${POSTGRES_PASSWORD:bookit_local_pass}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  # ── Redis (running in Docker) ───────────────────────────────────
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:redis_local_pass}

  # ── Kafka (running in Docker) ───────────────────────────────────
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: bookit-local
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# ── Verbose logging for local development ──────────────────────────
logging:
  level:
    com.bookit: DEBUG
    org.springframework.security: DEBUG
    org.flywaydb: DEBUG
    
# ── Local JWT Secret for Integration Tests ─────────────────────────
security:
  jwt:
    secret: bookit-super-secret-development-key-that-is-at-least-256-bits-long-32-bytes!